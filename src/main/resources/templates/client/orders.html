<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Mis órdenes - SISPRO3D')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-10">

        <h1 class="text-3xl font-bold text-gray-900 mb-2">Mis órdenes</h1>
        <p class="text-gray-500 mb-8">Trabajos que contrataste y su estado actual.</p>

        <div th:if="${success != null}"
             class="mb-6 rounded-lg bg-green-50 border border-green-200 text-green-800 px-4 py-3">
            <p th:text="${success}"></p>
        </div>
        <div th:if="${error != null}"
             class="mb-6 rounded-lg bg-red-50 border border-red-200 text-red-800 px-4 py-3">
            <p th:text="${error}"></p>
        </div>

        <div th:if="${#lists.isEmpty(activeOrders) and #lists.isEmpty(finishedOrders)}"
             class="bg-white rounded-xl shadow border border-gray-200 p-10 text-center">
            <p class="text-gray-600 mb-4">Todavía no tienes órdenes de trabajo.</p>
            <a th:href="@{/client/quotes}" class="inline-block bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                Ver mis cotizaciones
            </a>
        </div>

        <div th:if="${!activeOrders.isEmpty()}" class="mb-10">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">En curso</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <a th:each="order : ${activeOrders}"
                   th:href="@{/orders/{id}(id=${order.id})}"
                   class="bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-col hover:shadow-lg hover:border-indigo-200 transition cursor-pointer">

                    <div class="flex justify-between items-start gap-2 mb-3">
                        <h3 class="text-lg font-semibold text-gray-900"
                            th:text="${serviceTitles[order.offeredServiceId]}"></h3>
                        <span th:replace="~{fragments/status-badge :: badge(${order.status}, 'order')}"></span>
                    </div>

                    <div class="flex justify-between items-center text-sm mb-4 mt-1 gap-3">
                        <span class="font-bold text-indigo-600 text-lg" th:text="'#' + ${order.id}"></span>
                        <span class="text-gray-500 text-right"
                              th:text="${order.completedAt != null}
                                  ? ('Completada ' + ${#temporals.format(order.completedAt, 'dd/MM/yyyy')})
                                  : ('Creada ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy')} + (${order.startedAt != null} ? ' · Iniciada ' + ${#temporals.format(order.startedAt, 'dd/MM/yyyy')} : ''))"></span>
                    </div>

                    <div class="pt-3 border-t border-gray-100 mt-auto flex items-center justify-end">
                        <span class="text-sm text-indigo-600 font-medium">Ver detalle &rarr;</span>
                    </div>
                </a>
            </div>
        </div>

        <div th:if="${!finishedOrders.isEmpty()}">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Finalizadas</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <a th:each="order : ${finishedOrders}"
                   th:href="@{/orders/{id}(id=${order.id})}"
                   class="bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-col hover:shadow-lg hover:border-indigo-200 transition cursor-pointer">

                    <div class="flex justify-between items-start gap-2 mb-3">
                        <h3 class="text-lg font-semibold text-gray-900"
                            th:text="${serviceTitles[order.offeredServiceId]}"></h3>
                        <span th:replace="~{fragments/status-badge :: badge(${order.status}, 'order')}"></span>
                    </div>

                    <div class="flex justify-between items-center text-sm mb-4 mt-1 gap-3">
                        <span class="font-bold text-indigo-600 text-lg" th:text="'#' + ${order.id}"></span>
                        <span class="text-gray-500 text-right"
                              th:text="${order.completedAt != null}
                                  ? ('Completada ' + ${#temporals.format(order.completedAt, 'dd/MM/yyyy')})
                                  : ('Creada ' + ${#temporals.format(order.createdAt, 'dd/MM/yyyy')} + (${order.startedAt != null} ? ' · Iniciada ' + ${#temporals.format(order.startedAt, 'dd/MM/yyyy')} : ''))"></span>
                    </div>

                    <div class="pt-3 border-t border-gray-100 mt-auto flex items-center justify-end">
                        <span class="text-sm text-indigo-600 font-medium">Ver detalle &rarr;</span>
                    </div>
                </a>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
