<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Mis cotizaciones - SISPRO3D')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-10">

        <h1 class="text-3xl font-bold text-gray-900 mb-2">Mis cotizaciones</h1>
        <p class="text-gray-500 mb-8">Solicitudes que has enviado a los expertos.</p>

        <div th:if="${success != null}"
             class="mb-6 rounded-lg bg-green-50 border border-green-200 text-green-800 px-4 py-3">
            <p th:text="${success}"></p>
        </div>
        <div th:if="${error != null}"
             class="mb-6 rounded-lg bg-red-50 border border-red-200 text-red-800 px-4 py-3">
            <p th:text="${error}"></p>
        </div>

        <div th:if="${#lists.isEmpty(pendingQuotes) and #lists.isEmpty(answeredQuotes)}"
             class="bg-white rounded-xl shadow border border-gray-200 p-10 text-center">
            <p class="text-gray-600 mb-4">Todavía no has solicitado ninguna cotización.</p>
            <a th:href="@{/services}" class="inline-block bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                Ver el catálogo
            </a>
        </div>

        <div th:if="${!pendingQuotes.isEmpty()}" class="mb-10">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Por responder</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div th:each="quote : ${pendingQuotes}"
                     class="bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-col hover:shadow-lg hover:border-indigo-200 transition">

                    <div class="flex justify-between items-start gap-2 mb-3">
                        <h3 class="text-lg font-semibold text-gray-900"
                            th:text="${serviceTitles[quote.offeredServiceId]}"></h3>
                        <span th:replace="~{fragments/status-badge :: badge(${quote.status}, 'quote')}"></span>
                    </div>

                    <p th:if="${quote.description != null}"
                       class="text-gray-600 text-sm flex-grow whitespace-pre-line line-clamp-3 mb-4"
                       th:text="${quote.description}"></p>
                    <div th:unless="${quote.description != null}" class="flex-grow mb-4"></div>

                    <div class="flex justify-between items-center text-sm mb-4 gap-3">
                        <span class="font-bold text-indigo-600 text-lg"
                              th:text="${quote.totalAmount != null}
                                  ? ('$' + ${#numbers.formatDecimal(quote.totalAmount, 1, 2)})
                                  : 'Por definir'"></span>
                        <span class="text-gray-500 text-right"
                              th:text="${quote.validUntil != null}
                                  ? ('Vigencia ' + ${#temporals.format(quote.validUntil, 'dd/MM/yyyy')})
                                  : 'Vigencia por definir'"></span>
                    </div>

                    <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-3">
                        <a th:href="@{/services/{id}(id=${quote.offeredServiceId})}"
                           class="text-sm text-indigo-600 hover:text-indigo-800 font-medium shrink-0">
                            Ver servicio &rarr;
                        </a>
                        <div class="flex flex-wrap justify-end gap-2">
                            <form th:if="${quote.totalAmount == null}"
                                  th:action="@{/client/quotes/{id}/cancel(id=${quote.id})}" method="post">
                                <button type="submit"
                                        class="border border-red-300 text-red-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition">
                                    Cancelar solicitud
                                </button>
                            </form>
                            <form th:if="${quote.totalAmount != null}"
                                  th:action="@{/client/quotes/{id}/accept(id=${quote.id})}" method="post">
                                <button type="submit"
                                        class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700 transition">
                                    Aceptar
                                </button>
                            </form>
                            <form th:if="${quote.totalAmount != null}"
                                  th:action="@{/client/quotes/{id}/reject(id=${quote.id})}" method="post">
                                <button type="submit"
                                        class="border border-red-300 text-red-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition">
                                    Rechazar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${!answeredQuotes.isEmpty()}">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Historial</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div th:each="quote : ${answeredQuotes}"
                     class="bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-col hover:shadow-lg hover:border-indigo-200 transition">

                    <div class="flex justify-between items-start gap-2 mb-3">
                        <h3 class="text-lg font-semibold text-gray-900"
                            th:text="${serviceTitles[quote.offeredServiceId]}"></h3>
                        <span th:replace="~{fragments/status-badge :: badge(${quote.status}, 'quote')}"></span>
                    </div>

                    <p th:if="${quote.description != null}"
                       class="text-gray-600 text-sm flex-grow whitespace-pre-line line-clamp-3 mb-4"
                       th:text="${quote.description}"></p>
                    <div th:unless="${quote.description != null}" class="flex-grow mb-4"></div>

                    <div class="flex justify-between items-center text-sm mb-4 gap-3">
                        <span class="font-bold text-indigo-600 text-lg"
                              th:text="${quote.totalAmount != null}
                                  ? ('$' + ${#numbers.formatDecimal(quote.totalAmount, 1, 2)})
                                  : 'Por definir'"></span>
                        <span class="text-gray-500 text-right"
                              th:text="${quote.validUntil != null}
                                  ? ('Vigencia ' + ${#temporals.format(quote.validUntil, 'dd/MM/yyyy')})
                                  : 'Vigencia por definir'"></span>
                    </div>

                    <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-3">
                        <a th:href="@{/services/{id}(id=${quote.offeredServiceId})}"
                           class="text-sm text-indigo-600 hover:text-indigo-800 font-medium shrink-0">
                            Ver servicio &rarr;
                        </a>
                        <p th:if="${quote.status.name() == 'ACCEPTED'}" class="text-xs text-gray-500 text-right shrink-0">
                            Sigue el trabajo en
                            <a th:href="@{/client/orders}" class="text-indigo-600 hover:text-indigo-800 font-medium">mis órdenes</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
