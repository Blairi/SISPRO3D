<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SISPRO3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:fragment="navbar" class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <a href="/" class="text-xl font-bold text-indigo-600">SISPRO3D</a>

            <!-- No logueado -->
            <div th:if="${sessionUser == null}" class="flex gap-4 items-center">
                <a href="/login" class="text-gray-600 hover:text-indigo-600 font-medium">Iniciar sesión</a>
                <a href="/register" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Registro</a>
            </div>

            <!-- Logueado -->
            <div th:if="${sessionUser != null}" class="flex gap-4 items-center">
                <a th:if="${sessionUser.role.name() == 'EXPERT'}" href="/expert/dashboard"
                   class="text-gray-600 hover:text-indigo-600 font-medium">Dashboard</a>
                <a th:if="${sessionUser.role.name() == 'ADMIN'}" href="/admin/dashboard"
                   class="text-gray-600 hover:text-indigo-600 font-medium">Dashboard</a>
                <span class="text-gray-700 font-medium" th:text="${sessionUser.name + ' ' + sessionUser.lastName}"></span>
                <a href="/login/logout"
                   class="text-gray-500 hover:text-red-600 font-medium text-sm transition">
                    Cerrar sesión
                </a>
            </div>

        </div>
    </div>
</nav>

<main class="flex-grow">
</body>
</html>
