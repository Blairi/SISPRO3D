<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SISPRO3D</title>
    <link rel="stylesheet" th:href="@{/css/sispro3d.css}">
    <script th:src="@{/vendor/tailwind/tailwind.min.js}"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:fragment="navbar" class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-6">
                <a href="/" class="text-xl font-bold text-indigo-600">SISPRO3D</a>
                <a href="/services" class="text-gray-600 hover:text-indigo-600 font-medium">Servicios</a>

                <!-- Navegación por rol (logueado) -->
                <details th:if="${sessionUser != null}" class="relative">
                    <summary class="list-none cursor-pointer select-none text-gray-600 hover:text-indigo-600 font-medium">
                        Menú
                    </summary>
                    <div class="absolute left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50">
                        <a th:if="${sessionUser.role.name() == 'CLIENT'}" href="/client/quotes"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Mis cotizaciones</a>
                        <a th:if="${sessionUser.role.name() == 'CLIENT'}" href="/client/orders"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Mis órdenes</a>
                        <a th:if="${sessionUser.role.name() == 'EXPERT'}" href="/expert/quotes"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Cotizaciones</a>
                        <a th:if="${sessionUser.role.name() == 'EXPERT'}" href="/expert/orders"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Órdenes</a>
                        <a th:if="${sessionUser.role.name() == 'EXPERT'}" href="/expert/dashboard"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Servicios</a>
                        <a th:if="${sessionUser.role.name() == 'ADMIN'}" href="/admin/dashboard"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Dashboard</a>
                        <a th:if="${sessionUser.role.name() == 'ADMIN'}" href="/admin/categories"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Categorías</a>
                        <a th:if="${sessionUser.role.name() == 'ADMIN'}" href="/admin/users"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Usuarios</a>
                        <a th:if="${sessionUser.role.name() == 'ADMIN'}" href="/admin/reports"
                           class="block px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Reportes</a>
                    </div>
                </details>
            </div>

            <!-- No logueado -->
            <div th:if="${sessionUser == null}" class="flex gap-4 items-center">
                <a href="/login" class="text-gray-600 hover:text-indigo-600 font-medium">Iniciar sesión</a>
                <a href="/register" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Registro</a>
            </div>

            <!-- Cluster de usuario (logueado): nombre + cerrar sesión -->
            <div th:if="${sessionUser != null}" class="flex items-center gap-3">
                <span class="text-gray-700 font-medium" th:text="${sessionUser.name + ' ' + sessionUser.lastName}"></span>
                <span class="text-gray-300" aria-hidden="true">|</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="text-gray-500 hover:text-red-600 font-medium text-sm transition">
                        Cerrar sesión
                    </button>
                </form>
            </div>

        </div>
    </div>
</nav>

<main class="flex-grow">
</body>
</html>
