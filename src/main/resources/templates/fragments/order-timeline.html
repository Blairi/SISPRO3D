<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<div th:fragment="timeline(order)"
     th:with="s=${order.status.name()},
              canceled=${s == 'CANCELED'},
              idx=${s == 'PENDING' ? 0 : (s == 'IN_PROGRESS' ? 1 : (s == 'IN_REVIEW' ? 2 : (s == 'COMPLETED' ? 3 : -1)))}">

    <ol class="flex items-start" role="list" aria-label="Etapas de la orden">
        <li class="flex-1 flex flex-col items-center">
            <div class="flex items-center w-full">
                <div class="h-0.5 flex-1 bg-transparent"></div>
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                      th:classappend="${idx < 0 ? 'bg-gray-200 text-gray-500' : ('bg-indigo-600 text-white' + (idx == 0 ? ' ring-2 ring-offset-2 ring-indigo-300' : ''))}"
                      th:text="${idx >= 0} ? '✓' : '1'"></span>
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 1} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
            </div>
            <span class="mt-2 text-xs text-center"
                  th:classappend="${idx == 0 ? 'text-indigo-700 font-semibold' : (idx >= 0 ? 'text-gray-900 font-medium' : 'text-gray-400')}"
                  th:text="#{status.order.PENDING}">Pendiente</span>
            <span class="text-[10px] text-gray-400 min-h-[14px]"
                  th:text="${order.createdAt != null} ? ${#temporals.format(order.createdAt, 'dd/MM/yyyy')} : ''"></span>
        </li>

        <li class="flex-1 flex flex-col items-center">
            <div class="flex items-center w-full">
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 1} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                      th:classappend="${idx < 1 ? 'bg-gray-200 text-gray-500' : ('bg-indigo-600 text-white' + (idx == 1 ? ' ring-2 ring-offset-2 ring-indigo-300' : ''))}"
                      th:text="${idx >= 1} ? '✓' : '2'"></span>
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 2} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
            </div>
            <span class="mt-2 text-xs text-center"
                  th:classappend="${idx == 1 ? 'text-indigo-700 font-semibold' : (idx >= 1 ? 'text-gray-900 font-medium' : 'text-gray-400')}"
                  th:text="#{status.order.IN_PROGRESS}">En progreso</span>
            <span class="text-[10px] text-gray-400 min-h-[14px]"
                  th:text="${order.startedAt != null} ? ${#temporals.format(order.startedAt, 'dd/MM/yyyy')} : ''"></span>
        </li>

        <li class="flex-1 flex flex-col items-center">
            <div class="flex items-center w-full">
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 2} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                      th:classappend="${idx < 2 ? 'bg-gray-200 text-gray-500' : ('bg-indigo-600 text-white' + (idx == 2 ? ' ring-2 ring-offset-2 ring-indigo-300' : ''))}"
                      th:text="${idx >= 2} ? '✓' : '3'"></span>
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 3} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
            </div>
            <span class="mt-2 text-xs text-center"
                  th:classappend="${idx == 2 ? 'text-indigo-700 font-semibold' : (idx >= 2 ? 'text-gray-900 font-medium' : 'text-gray-400')}"
                  th:text="#{status.order.IN_REVIEW}">En revisión</span>
            <span class="text-[10px] text-gray-400 min-h-[14px]"></span>
        </li>

        <li class="flex-1 flex flex-col items-center">
            <div class="flex items-center w-full">
                <div class="h-0.5 flex-1"
                     th:classappend="${idx >= 3} ? 'bg-indigo-600' : 'bg-gray-200'"></div>
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                      th:classappend="${idx < 3 ? 'bg-gray-200 text-gray-500' : ('bg-indigo-600 text-white' + (idx == 3 ? ' ring-2 ring-offset-2 ring-indigo-300' : ''))}"
                      th:text="${idx >= 3} ? '✓' : '4'"></span>
                <div class="h-0.5 flex-1 bg-transparent"></div>
            </div>
            <span class="mt-2 text-xs text-center"
                  th:classappend="${idx == 3 ? 'text-indigo-700 font-semibold' : (idx >= 3 ? 'text-gray-900 font-medium' : 'text-gray-400')}"
                  th:text="#{status.order.COMPLETED}">Completada</span>
            <span class="text-[10px] text-gray-400 min-h-[14px]"
                  th:text="${order.completedAt != null} ? ${#temporals.format(order.completedAt, 'dd/MM/yyyy')} : ''"></span>
        </li>
    </ol>

    <p th:if="${canceled}" class="mt-3 text-xs font-semibold text-red-600">
        <span th:text="#{status.order.CANCELED}">Cancelada</span>
    </p>
</div>
</html>
