<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('SISPRO3D - Error')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-3xl mx-auto px-4 py-20 text-center">
        <div class="bg-white rounded-xl shadow border border-gray-200 p-10">
            <p class="text-6xl font-bold text-indigo-600 mb-4" th:text="${status != null ? status : 'Error'}">Error</p>
            <h1 class="text-2xl font-bold text-gray-900 mb-3">Ocurrió un error</h1>
            <p class="text-gray-600 mb-8">
                No pudimos completar tu solicitud. Intentá de nuevo o volvé al inicio.
            </p>
            <div class="flex items-center justify-center gap-4">
                <a href="/" class="bg-indigo-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-indigo-700 transition">
                    Volver al inicio
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
