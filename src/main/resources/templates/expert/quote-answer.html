<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Responder cotización - SISPRO3D')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-3xl mx-auto px-4 py-10">

        <a th:href="@{/expert/quotes}" class="inline-block text-sm text-indigo-600 hover:text-indigo-800 font-medium mb-6">
            &larr; Volver a mis cotizaciones
        </a>

        <div class="bg-white rounded-xl shadow border border-gray-200 p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Responder cotización</h1>
            <p class="text-sm text-gray-500 mb-8">
                Propón un monto total y la fecha hasta la que la oferta sigue vigente.
            </p>

            <div class="flex items-center justify-between gap-4 mb-8 pb-6 border-b border-gray-200">
                <div>
                    <p class="font-semibold text-gray-900" th:text="${serviceTitle}"></p>
                    <p class="text-sm text-gray-500" th:text="'Cliente: ' + ${clientName}"></p>
                </div>
            </div>

            <div th:if="${quote.description != null}" class="mb-8 rounded-lg bg-gray-50 border border-gray-200 p-4">
                <p class="text-xs font-semibold text-gray-400 uppercase mb-2">Lo que el cliente pidió</p>
                <p class="text-gray-700 whitespace-pre-line" th:text="${quote.description}"></p>
            </div>

            <form th:action="@{/expert/quotes/{id}/answer(id=${quote.id})}" method="post" th:object="${answer}" class="space-y-6">

                <div>
                    <label th:for="totalAmount" class="block text-sm font-semibold text-gray-900 mb-2">
                        Monto total
                    </label>
                    <input type="number" step="0.01" min="0.01" th:field="*{totalAmount}" id="totalAmount"
                           th:errorclass="border-red-500"
                           placeholder="0.00"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label th:for="validUntil" class="block text-sm font-semibold text-gray-900 mb-2">
                        Vigencia (hasta)
                    </label>
                    <input type="date" th:field="*{validUntil}" id="validUntil"
                           th:errorclass="border-red-500"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p th:if="${#fields.hasErrors('validUntil')}" th:errors="*{validUntil}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <div class="flex items-center gap-4">
                    <button type="submit"
                            class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                        Enviar respuesta
                    </button>
                    <a th:href="@{/expert/quotes}"
                       class="text-gray-600 hover:text-gray-900 font-medium">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
