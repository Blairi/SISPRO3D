<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Registrar entregable - SISPRO3D')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-3xl mx-auto px-4 py-10">

        <a th:href="@{/orders/{id}(id=${order.id})}" class="inline-block text-sm text-indigo-600 hover:text-indigo-800 font-medium mb-6">
            &larr; Volver a la orden #<span th:text="${order.id}"></span>
        </a>

        <div class="bg-white rounded-xl shadow border border-gray-200 p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Registrar entregable</h1>
            <p class="text-sm text-gray-500 mb-8">
                Adjunta la referencia de un archivo entregado al cliente en la orden #<span th:text="${order.id}"></span>.
            </p>

            <form th:action="@{/expert/orders/{id}/deliverables(id=${order.id})}" method="post"
                  th:object="${deliverable}" class="space-y-6">

                <div>
                    <label th:for="name" class="block text-sm font-semibold text-gray-900 mb-2">
                        Nombre del entregable
                    </label>
                    <input type="text" th:field="*{name}" id="name"
                           th:errorclass="border-red-500"
                           placeholder="Ej. Modelo principal .OBJ"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label th:for="urlFile" class="block text-sm font-semibold text-gray-900 mb-2">
                        Referencia del archivo
                    </label>
                    <input type="url" th:field="*{urlFile}" id="urlFile"
                           th:errorclass="border-red-500"
                           placeholder="https://..."
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p th:if="${#fields.hasErrors('urlFile')}" th:errors="*{urlFile}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <div>
                    <label th:for="fileType" class="block text-sm font-semibold text-gray-900 mb-2">
                        Tipo de archivo
                    </label>
                    <select th:field="*{fileType}" id="fileType"
                            th:errorclass="border-red-500"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Selecciona un formato</option>
                        <option value="OBJ">.OBJ</option>
                        <option value="FBX">.FBX</option>
                        <option value="STL">.STL</option>
                        <option value="BLEND">.BLEND</option>
                    </select>
                    <p th:if="${#fields.hasErrors('fileType')}" th:errors="*{fileType}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <div class="flex items-center gap-4">
                    <button type="submit"
                            class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                        Registrar entregable
                    </button>
                    <a th:href="@{/orders/{id}(id=${order.id})}"
                       class="text-gray-600 hover:text-gray-900 font-medium">Cancelar</a>
                </div>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
