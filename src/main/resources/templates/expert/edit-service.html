<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('SISPRO3D - Editar servicio')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-2xl mx-auto px-4 py-10">

        <div class="mb-8">
            <a href="/expert/dashboard" class="text-indigo-600 hover:text-indigo-700 text-sm font-medium">&larr; Volver al dashboard</a>
            <h1 class="text-3xl font-bold text-gray-900 mt-2">Editar servicio</h1>
        </div>

        <form th:action="@{/expert/services/{id}/edit(id=${serviceId})}"
              th:object="${offeredservice}"
              method="post"
              class="bg-white shadow rounded-lg p-8 space-y-6">

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Título *</label>
                <input type="text" id="title" th:field="*{title}" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"/>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="basePrice" class="block text-sm font-medium text-gray-700 mb-1">Precio base ($) *</label>
                    <input type="number" id="basePrice" th:field="*{basePrice}" step="0.01" min="0" required
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"/>
                </div>
                <div>
                    <label for="deliveryTimeDays" class="block text-sm font-medium text-gray-700 mb-1">Tiempo de entrega (días) *</label>
                    <input type="number" id="deliveryTimeDays" th:field="*{deliveryTimeDays}" min="1" required
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"/>
                </div>
            </div>

            <div>
                <label for="categoryId" class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
                <select id="categoryId" th:field="*{categoryId}" required
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    <option value="">Selecciona una categoría</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Guardar cambios
            </button>

        </form>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
