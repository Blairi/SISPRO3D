<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('SISPRO3D - Iniciar sesión')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-md mx-auto px-4 py-16">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Iniciar sesión</h1>
            <p class="text-gray-600 mt-2">Ingresa a tu cuenta de SISPRO3D</p>
        </div>

        <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/login}" method="post"
              class="bg-white shadow rounded-lg p-8 space-y-6">

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input type="email" id="email" name="email" th:value="${email}" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"/>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"/>
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Entrar
            </button>

        </form>

        <p class="text-center text-gray-500 text-sm mt-6">
            ¿No tienes cuenta? <a href="/register" class="text-indigo-600 hover:text-indigo-700 font-medium">Regístrate</a>
        </p>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
