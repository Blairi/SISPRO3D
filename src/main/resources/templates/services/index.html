<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('SISPRO3D - Servicios')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-10">

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Servicios de modelado 3D</h1>
            <p class="text-gray-600 mt-1">Explorá los servicios aprobados por nuestros expertos.</p>
        </div>

        <form method="get" th:action="@{/services}" class="bg-white rounded-xl shadow border border-gray-200 p-5 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="lg:col-span-3">
                    <label for="q" class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
                    <input type="text" id="q" name="q" th:value="${filterQuery}"
                           placeholder="Título, descripción o experto"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="categoryId" class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                    <select id="categoryId" name="categoryId"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="">Todas</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${filterCategoryId != null and filterCategoryId == cat.id}"></option>
                    </select>
                </div>
                <div>
                    <label for="minPrice" class="block text-sm font-medium text-gray-700 mb-1">Precio mínimo</label>
                    <input type="number" step="0.01" min="0" id="minPrice" name="minPrice" th:value="${filterMinPrice}"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="maxPrice" class="block text-sm font-medium text-gray-700 mb-1">Precio máximo</label>
                    <input type="number" step="0.01" min="0" id="maxPrice" name="maxPrice" th:value="${filterMaxPrice}"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="maxDeliveryDays" class="block text-sm font-medium text-gray-700 mb-1">Días de entrega máx.</label>
                    <input type="number" min="0" id="maxDeliveryDays" name="maxDeliveryDays" th:value="${filterMaxDeliveryDays}"
                           class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="sort" class="block text-sm font-medium text-gray-700 mb-1">Orden</label>
                    <select id="sort" name="sort"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="NEWEST" th:selected="${filterSort != null and filterSort.name() == 'NEWEST'}">Más recientes</option>
                        <option value="PRICE_ASC" th:selected="${filterSort != null and filterSort.name() == 'PRICE_ASC'}">Precio: menor a mayor</option>
                        <option value="PRICE_DESC" th:selected="${filterSort != null and filterSort.name() == 'PRICE_DESC'}">Precio: mayor a menor</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex items-center gap-4">
                <button type="submit"
                        class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Buscar
                </button>
                <a th:href="@{/services}" class="text-sm text-gray-600 hover:text-gray-900">Limpiar filtros</a>
            </div>
            <ul th:if="${!#lists.isEmpty(filterErrors)}" class="mt-3 text-sm text-red-600 space-y-1">
                <li th:each="err : ${filterErrors}" th:text="${err}"></li>
            </ul>
        </form>

        <p th:if="${!#lists.isEmpty(services)}" class="text-sm text-gray-500 mb-4">
            <span th:text="${#lists.size(services)}"></span>
            <span th:text="${#lists.size(services) == 1} ? 'servicio encontrado' : 'servicios encontrados'"></span>
        </p>

        <div th:if="${#lists.isEmpty(services)} and ${!hasApprovedServices}" class="text-center py-20 bg-white rounded-xl border border-gray-200">
            <p class="text-gray-500 text-lg">No hay servicios disponibles en este momento.</p>
        </div>

        <div th:if="${#lists.isEmpty(services)} and ${hasApprovedServices}" class="text-center py-20 bg-white rounded-xl border border-gray-200">
            <p class="text-gray-500 text-lg">No se encontraron servicios con esos filtros.</p>
            <a th:href="@{/services}" class="inline-block mt-4 text-sm text-indigo-600 hover:underline">Limpiar filtros</a>
        </div>

        <div th:if="${!#lists.isEmpty(services)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <a th:each="svc : ${services}"
               th:href="@{/services/{id}(id=${svc.id})}"
               class="bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-col hover:shadow-lg hover:border-indigo-200 transition">

                <div class="flex justify-between items-start mb-3">
                    <h2 class="text-lg font-semibold text-gray-900" th:text="${svc.title}"></h2>
                    <span th:if="${svc.categoryName != null}"
                          class="text-xs font-medium bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full whitespace-nowrap"
                          th:text="${svc.categoryName}"></span>
                </div>

                <p class="text-gray-600 text-sm flex-grow line-clamp-3 mb-4" th:text="${svc.description}"></p>

                <div class="flex justify-between items-center text-sm mb-4">
                    <span class="font-bold text-indigo-600 text-lg" th:text="'$' + ${#numbers.formatDecimal(svc.basePrice, 1, 2)}"></span>
                    <span class="text-gray-500" th:text="${svc.deliveryTimeDays} + ' días de entrega'"></span>
                </div>

                <div class="pt-3 border-t border-gray-100 flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
                        <span class="text-indigo-600 font-semibold text-xs"
                              th:text="${svc.expertName == null} ? '?' : ${svc.expertName.substring(0,1)}"></span>
                    </div>
                    <span class="text-sm text-gray-700 font-medium" th:text="${svc.expertName}"></span>
                </div>
            </a>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
