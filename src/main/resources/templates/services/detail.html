<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head(${service.title} + ' - SISPRO3D')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-10">

        <a th:href="@{/services}" class="inline-block text-sm text-indigo-600 hover:text-indigo-800 font-medium mb-6">
            &larr; Volver al catálogo
        </a>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Columna principal -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow border border-gray-200 p-8">
                <span th:if="${service.categoryName != null}"
                      class="inline-block text-xs font-medium bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full mb-4"
                      th:text="${service.categoryName}"></span>

                <h1 class="text-3xl font-bold text-gray-900 mb-6" th:text="${service.title}"></h1>

                <p class="text-gray-700 leading-relaxed whitespace-pre-line" th:text="${service.description}"></p>
            </div>

            <!-- Tarjeta del experto -->
            <aside class="bg-white rounded-xl shadow border border-gray-200 p-6 h-fit">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-4">Experto del servicio</p>

                <div class="flex items-center gap-3 mb-5">
                    <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
                        <span class="text-indigo-600 font-semibold text-lg"
                              th:text="${expert.name.substring(0,1) + expert.lastName.substring(0,1)}"></span>
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-gray-900 truncate"
                           th:text="${expert.name + ' ' + expert.lastName}"></p>
                        <p class="text-xs text-gray-500 truncate" th:text="${expert.email}"></p>
                    </div>
                </div>

                <dl class="space-y-3 text-sm">
                    <div th:if="${expert.specialty != null}">
                        <dt class="text-gray-400 uppercase text-xs font-semibold">Especialidad</dt>
                        <dd class="text-gray-700" th:text="${expert.specialty}"></dd>
                    </div>
                    <div th:if="${expert.yearsExperience != null}">
                        <dt class="text-gray-400 uppercase text-xs font-semibold">Experiencia</dt>
                        <dd class="text-gray-700" th:text="${expert.yearsExperience} + ' años'"></dd>
                    </div>
                    <div th:if="${expert.portfolioUrl != null}">
                        <dt class="text-gray-400 uppercase text-xs font-semibold">Portafolio</dt>
                        <dd><a th:href="${expert.portfolioUrl}" target="_blank" rel="noopener"
                               class="text-indigo-600 hover:text-indigo-800 font-medium">Ver trabajos</a></dd>
                    </div>
                    <div th:if="${expert.bio != null}">
                        <dt class="text-gray-400 uppercase text-xs font-semibold">Sobre el experto</dt>
                        <dd class="text-gray-700 leading-relaxed" th:text="${expert.bio}"></dd>
                    </div>
                </dl>
            </aside>

        </div>

        <!-- Precio y entrega -->
        <div class="mt-8 bg-white rounded-xl shadow border border-gray-200 p-6 flex flex-wrap items-center gap-x-10 gap-y-4">
            <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Precio base</p>
                <p class="text-2xl font-bold text-indigo-600"
                   th:text="'$' + ${#numbers.formatDecimal(service.basePrice, 1, 2)}"></p>
            </div>
            <div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Entrega</p>
                <p class="text-lg font-medium text-gray-900"
                   th:text="${service.deliveryTimeDays} + ' días'"></p>
            </div>

            <div class="ml-auto">
                <a th:if="${sessionUser == null or sessionUser.role.name() == 'CLIENT'}"
                   th:href="@{/services/{id}/quote(id=${service.id})}"
                   class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Contratar
                </a>
            </div>
        </div>

        <!-- Reseñas -->
        <div class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div th:if="${canReview}"
                 class="lg:col-span-1 bg-white rounded-xl shadow border border-gray-200 p-6 h-fit">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-4">Deja tu reseña</h2>

                <div th:if="${reviewSuccess != null}"
                     class="mb-4 rounded-lg bg-green-50 border border-green-200 text-green-800 px-4 py-3 text-sm">
                    <p th:text="${reviewSuccess}"></p>
                </div>
                <div th:if="${reviewError != null}"
                     class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-800 px-4 py-3 text-sm">
                    <p th:text="${reviewError}"></p>
                </div>

                <form th:action="@{/services/{id}/review(id=${service.id})}" method="post"
                      th:object="${reviewRequest}" class="space-y-4">
                    <div>
                        <label th:for="rating" class="block text-sm font-semibold text-gray-900 mb-2">
                            Calificación
                        </label>
                        <select th:field="*{rating}" id="rating"
                                th:errorclass="border-red-500"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Selecciona (1-5)</option>
                            <option value="1">1 - Muy malo</option>
                            <option value="2">2 - Malo</option>
                            <option value="3">3 - Regular</option>
                            <option value="4">4 - Bueno</option>
                            <option value="5">5 - Excelente</option>
                        </select>
                    </div>
                    <div>
                        <label th:for="comment" class="block text-sm font-semibold text-gray-900 mb-2">
                            Comentario (opcional)
                        </label>
                        <textarea th:field="*{comment}" id="comment" rows="3"
                                  placeholder="¿Cómo fue tu experiencia?"
                                  class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <button type="submit"
                            class="w-full bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                        Publicar reseña
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white rounded-xl shadow border border-gray-200 p-6">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide">Reseñas del servicio</h2>
                    <div th:if="${avgRating != null}" class="flex items-center gap-2">
                        <span class="text-2xl font-bold text-gray-900" th:text="${avgRating}"></span>
                        <span class="text-amber-500 text-xl" th:text="${'★'.repeat(avgStars)}"></span>
                    </div>
                </div>

                <p th:if="${#lists.isEmpty(reviews)}" class="text-sm text-gray-500">
                    Todavía no hay reseñas para este servicio.
                </p>

                <div th:unless="${#lists.isEmpty(reviews)}" class="space-y-4">
                    <div th:each="review : ${reviews}"
                         class="rounded-lg border border-gray-200 p-4">
                        <div class="flex items-center justify-between gap-4 mb-2">
                            <p class="font-semibold text-gray-900" th:text="${reviewerNames[review.clientId]}"></p>
                            <span class="text-amber-500 text-sm" th:text="${'★'.repeat(review.rating)}"></span>
                        </div>
                        <p th:if="${review.comment != null}"
                           class="text-sm text-gray-700 whitespace-pre-line" th:text="${review.comment}"></p>
                        <p class="text-xs text-gray-400 mt-2"
                           th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy')}"></p>
                    </div>
                </div>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
