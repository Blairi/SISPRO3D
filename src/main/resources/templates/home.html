<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('SISPRO3D - Inicio')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 py-12">

        <!-- No logueado -->
        <div th:if="${sessionUser == null}" class="text-center">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Bienvenido a SISPRO3D</h1>
            <p class="text-lg text-gray-600 mb-8">Plataforma de servicios de modelado 3D</p>
            <div class="flex gap-4 justify-center">
                <a href="/login"
                   class="bg-white text-indigo-600 border border-indigo-600 px-6 py-3 rounded-lg font-medium hover:bg-indigo-50 transition">
                    Iniciar sesión
                </a>
                <a href="/register"
                   class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
                    Crear cuenta
                </a>
            </div>
        </div>

        <!-- Logueado -->
        <div th:if="${sessionUser != null}" class="text-center">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">
                Hola, <span th:text="${sessionUser.name}"></span>
            </h1>
            <p class="text-lg text-gray-600 mb-8">Bienvenido de vuelta a SISPRO3D</p>
            <p class="text-sm text-gray-500">
                Rol: <span class="font-medium" th:text="${sessionUser.role}"></span>
            </p>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
