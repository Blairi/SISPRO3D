spring.application.name=sispro3d

# Thymeleaf
spring.thymeleaf.cache=false

# Messages (validación)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Mariadb
spring.datasource.url=jdbc:mariadb://localhost:3306/sispro3d_db?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=appuser
spring.datasource.password=MiPasswordSegura123!
# pool de conexiones
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT (API /api/v1)
# La clave y los tiempos de vida son externos: sobrescribilos por entorno
# (variables de entorno o --spring.config) en cualquier despliegue real.
app.jwt.secret=${SISPRO3D_JWT_SECRET:dev-only-signing-key-cambiar-en-produccion-0123456789}
app.jwt.access-ttl=PT30M
app.jwt.refresh-ttl=P7D
app.jwt.issuer=sispro3d

# Almacenamiento local de archivos subidos (entregables y previsualizaciones)
app.storage.location=uploads
# El límite del contenedor se deja por encima del máximo de negocio (100 MB para
# comprimidos) para que el validador rechace con un mensaje en español.
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=111MB